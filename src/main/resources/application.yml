spring:
  application:
    name: goals-app-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goals}
    username: ${DB_USER:goals}
    password: ${DB_PASSWORD:goals}
  mail:
    default-encoding: UTF-8
    properties:
      "[mail.smtp.connectiontimeout]": 2000
      "[mail.smtp.timeout]": 2000
      "[mail.smtp.writetimeout]": 2000
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:true}
      "[mail.smtp.ssl.checkserveridentity]": true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

logging:
  pattern:
    # request_id кладёт RequestIdFilter; вне запроса поле пустое
    level: "%5p [%X{request_id:-}]"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

identity:
  code-pepper: ${IDENTITY_CODE_PEPPER:dev-code-pepper-change-me}
  reset-token-pepper: ${IDENTITY_RESET_TOKEN_PEPPER:dev-reset-token-pepper-change-me}
  code-ttl: 10m
  reset-token-ttl: 10m
  request-cooldown: 5m
  verify-limit: 3
  verify-window: 1m
  bcrypt-strength: ${IDENTITY_BCRYPT_STRENGTH:12}
  email:
    backend: ${IDENTITY_EMAIL_BACKEND:console}
    from: ${IDENTITY_EMAIL_FROM:no-reply@goals.local}
    host: ${IDENTITY_EMAIL_HOST:localhost}
    port: ${IDENTITY_EMAIL_PORT:25}
    username: ${IDENTITY_EMAIL_USERNAME:}
    password: ${IDENTITY_EMAIL_PASSWORD:}
    starttls: ${IDENTITY_EMAIL_STARTTLS:true}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    ru.trkpo.goals: DEBUG

---
spring:
  config:
    activate:
      on-profile: stage

management:
  endpoint:
    health:
      show-details: never
