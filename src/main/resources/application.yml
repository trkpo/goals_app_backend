spring:
  application:
    name: goals-app-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goals}
    username: ${DB_USER:goals}
    password: ${DB_PASSWORD:goals}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    ru.trkpo.goals: DEBUG

---
spring:
  config:
    activate:
      on-profile: stage

management:
  endpoint:
    health:
      show-details: never
