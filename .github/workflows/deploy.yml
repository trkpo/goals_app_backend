name: Deploy

# main → dev автоматически; stage — по тегу v* или вручную.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение
        type: choice
        options: [dev, stage]
        default: stage

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "environment=$INPUT_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "environment=stage" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ needs.image.outputs.environment }}
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.image.outputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ needs.image.outputs.environment }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.image.outputs.environment }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DOMAIN: ${{ vars.DOMAIN }}
      DEPLOY_DIR: /opt/goals-app
    steps:
      - name: Check environment is configured
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$DOMAIN" ]; then
            echo "::warning::Окружение $TARGET не настроено (SSH_HOST, SSH_USER, DOMAIN), деплой пропущен. См. docs/deploy.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

      - name: Upload deploy files
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh target "mkdir -p $DEPLOY_DIR"
          scp deploy/compose.yaml deploy/Caddyfile "target:$DEPLOY_DIR/"
          {
            echo "IMAGE=$IMAGE:$GITHUB_SHA"
            echo "SPRING_PROFILES_ACTIVE=$TARGET"
            echo "DOMAIN=$DOMAIN"
            echo "DB_PASSWORD=$DB_PASSWORD"
          } | ssh target "umask 077 && cat > $DEPLOY_DIR/.env"

      - name: Start
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh target "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh target "cd $DEPLOY_DIR && docker compose pull && docker compose up -d --remove-orphans --wait && docker image prune -f"
